<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support - ChouQuiz</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #5A5FAE 0%, #6A6FBE 25%, #7A7FCE 50%, #6A6FBE 75%, #5A5FAE 100%);
            min-height: 100vh;
            padding: 20px;
            line-height: 1.8;
            color: #333;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.98);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .header {
            text-align: center;
            margin: -40px -40px 40px -40px;
            padding: 30px 40px;
            background: linear-gradient(135deg, #5A5FAE, #7A7FCE, #9A9FDE);
            border-radius: 24px 24px 0 0;
            border-bottom: none;
        }

        .logo {
            font-size: 48px;
            margin-bottom: 10px;
        }

        h1 {
            color: #ffffff;
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.85);
            font-size: 16px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        label {
            font-weight: 600;
            color: #5A5FAE;
            font-size: 14px;
            margin-bottom: -12px;
        }

        input, textarea {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            font-family: inherit;
            transition: border-color 0.2s;
            outline: none;
        }

        input:focus, textarea:focus {
            border-color: #5A5FAE;
        }

        textarea {
            min-height: 160px;
            resize: vertical;
        }

        button {
            background: linear-gradient(135deg, #5A5FAE, #7A7FCE);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(90, 95, 174, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 24px;
            color: #5A5FAE;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .container {
                padding: 24px;
            }
            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="logo-chouquiz2.png" alt="ChouQuiz" style="width: 80px; margin-bottom: 10px; display: block; margin-left: auto; margin-right: auto;">
            <h1>Support ChouQuiz</h1>
            <p class="subtitle">Un problème, une question ? Écris-nous !</p>
        </div>

        <form action="mailto:support@chouquiz.fr" method="POST" enctype="text/plain">
            <label for="name">Ton nom</label>
            <input type="text" id="name" name="Nom" placeholder="Ex : Jean Dupont" required>

            <label for="email">Ton adresse e-mail</label>
            <input type="email" id="email" name="Email" placeholder="Ex : jean@exemple.fr" required>

            <label for="subject">Sujet</label>
            <input type="text" id="subject" name="Sujet" placeholder="Ex : Problème de connexion" required>

            <label for="message">Message</label>
            <textarea id="message" name="Message" placeholder="Décris ton problème ou ta question..." required></textarea>

            <button type="submit">Envoyer le message</button>
        </form>

        <a href="index.html" class="back-link">← Retour à l'accueil</a>
    </div>
</body>
</html>
